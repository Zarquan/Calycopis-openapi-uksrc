openapi: 3.1.0
info:
  title: IVOA ExecutionBroker web-service API
  version: "1.0"
  summary: IVOA ExecutionBroker web-service API
  description: >-
    OpenAPI schema for the IVOA ExecutionBroker web-service.
  contact:
    name:  Dave Morris
    email: openapi.dev@dm92.uk
    url: https://github.com/Zarquan
  license:
    name: Creative Commons Attribution Share Alike 4.0 International
    identifier: CC-BY-SA-4.0
servers:
  - url: http://localhost:8080
    description: Localhost development
paths:
  /requests:
    post:
      operationId: ExecutionRequest
      requestBody:
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/ExecutionRequest'
          application/xml:
            schema:
              $ref: './components.yaml#/components/schemas/ExecutionRequest'
          application/yaml:
            schema:
              $ref: './components.yaml#/components/schemas/ExecutionRequest'
        required: true
      responses:
        "303":
          description: >-
            A redirect response to the '/offersets/{uuid}' endpoint.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: url
        "200":
          description: >-
            A simple OK response with the offerset details.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/OfferSetResponse'
            application/xml:
              schema:
                $ref: './components.yaml#/components/schemas/OfferSetResponse'
            application/yaml:
              schema:
                $ref: './components.yaml#/components/schemas/OfferSetResponse'
        "400":
          description: >-
            400 Bad Request - The request body is malformed or does not match
            the schema.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/ProblemDetails'
        default:
          description: >-
            An RFC 9457 problem details response for any other error.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/ProblemDetails'

  /direct:
    post:
      operationId: DirectExecution
      requestBody:
        description: >-
          A direct request to execute an execution without going through the offers process.
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/ExecutionRequest'
          application/xml:
            schema:
              $ref: './components.yaml#/components/schemas/ExecutionRequest'
          application/yaml:
            schema:
              $ref: './components.yaml#/components/schemas/ExecutionRequest'
        required: true

      responses:
        "303":
          description: >-
            303 See Other - The request was accepted, returning a redirect to the execution details.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: url
        "200":
          description: >-
            200 OK - The request was accepted, returning the execution details.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/AbstractExecutionSession'
            application/xml:
              schema:
                $ref: './components.yaml#/components/schemas/AbstractExecutionSession'
            application/yaml:
              schema:
                $ref: './components.yaml#/components/schemas/AbstractExecutionSession'
        "400":
          description: >-
            400 Bad Request - The request was rejected, returning a
            FailedExecutionResponse with details of why the request was
            rejected. By default the failed execution is returned as an
            AbstractExecutionSession. When the broker's RFC 9457 evaluation
            flag is enabled, the response is an RFC 9457 problem details
            document instead.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/AbstractExecutionSession'
            application/xml:
              schema:
                $ref: './components.yaml#/components/schemas/AbstractExecutionSession'
            application/yaml:
              schema:
                $ref: './components.yaml#/components/schemas/AbstractExecutionSession'
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/ProblemDetails'
        default:
          description: >-
            An RFC 9457 problem details response for any other error.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/ProblemDetails'

  /offersets/{uuid}:
    get:
      operationId: OfferSetSelect
      parameters:
        - name: uuid
          in: path
          description: >-
            The UUID identifier of the OfferSet.
          required: true
          schema:
            type: string
            format: uuid
          style: simple
      responses:
        "200":
          description: >-
            The set of responses for each content type.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/OfferSetResponse'
            application/xml:
              schema:
                $ref: './components.yaml#/components/schemas/OfferSetResponse'
            application/yaml:
              schema:
                $ref: './components.yaml#/components/schemas/OfferSetResponse'
        "404":
          description: >-
            404 Not Found - No offer set was found for this UUID.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/ProblemDetails'
        default:
          description: >-
            An RFC 9457 problem details response for any other error.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/ProblemDetails'

  /sessions/{uuid}:
    get:
      operationId: SessionSelect
      parameters:
        - name: uuid
          in: path
          description: >-
            The UUID identifier of the ExecutionSession.
          required: true
          schema:
            type: string
            format: uuid
          style: simple
      responses:
        "200":
          description: >-
            200 OK - Details of the selected execution.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/AbstractExecutionSession'
            application/xml:
              schema:
                $ref: './components.yaml#/components/schemas/AbstractExecutionSession'
            application/yaml:
              schema:
                $ref: './components.yaml#/components/schemas/AbstractExecutionSession'
        "404":
          description: >-
            404 Not Found - No execution session was found for this UUID.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/ProblemDetails'
        default:
          description: >-
            An RFC 9457 problem details response for any other error.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/ProblemDetails'

    post:
      operationId: SessionUpdate
      parameters:
        - name: uuid
          in: path
          description: >-
            The UUID identifier of the ExecutionSession.
          required: true
          schema:
            type: string
            format: uuid
          style: simple
      requestBody:
        required: true
        description: >-
          Details of the update request.
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/AbstractUpdate'
          application/xml:
            schema:
              $ref: './components.yaml#/components/schemas/AbstractUpdate'
          application/yaml:
            schema:
              $ref: './components.yaml#/components/schemas/AbstractUpdate'
      responses:
        "200":
          description: >-
            200 OK - Details of the updated execution.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/AbstractExecutionSession'
            application/xml:
              schema:
                $ref: './components.yaml#/components/schemas/AbstractExecutionSession'
            application/yaml:
              schema:
                $ref: './components.yaml#/components/schemas/AbstractExecutionSession'
        "400":
          description: >-
            400 Bad Request - The update request was malformed, or it asked
            for a change that is not valid for this execution session.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/ProblemDetails'
        "403":
          description: >-
            403 Forbidden - The authenticated identity is not allowed to
            update this execution session.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/ProblemDetails'
        "404":
          description: >-
            404 Not Found - No execution session was found for this UUID.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/ProblemDetails'
        default:
          description: >-
            An RFC 9457 problem details response for any other error.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/ProblemDetails'




